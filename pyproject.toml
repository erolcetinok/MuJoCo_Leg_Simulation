[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quadruped"
version = "0.1.0"
description = "MuJoCo + Dynamixel quadruped: shared kinematics, control, and backends for sim and hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Erol Cetinok" }]

dependencies = [
    "numpy",
    "scipy",
    "mujoco",
    "pyserial>=3.5",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
gui = ["dearpygui"]
dev = ["pytest"]

# No [project.scripts]: commands live in scripts/ and are run as
# `python scripts/<name>.py`. Installing this package provides `import
# quadruped` for those scripts (and the tests) — nothing more.

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/quadruped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
