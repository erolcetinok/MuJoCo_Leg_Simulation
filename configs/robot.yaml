robot: quadruped
description_xml: description/quadruped.xml

serial:
  baud_host: 57600 # softwareSerial ceiling on UNO R3
  baud_dxl: 115200

# host-only actuator constants. used by kinematics/jacobian.foot_force to turn the DXL
# present-current into joint torque, then into a cartesian foot force.
actuator:
  # XL430-W250 gear-output torque constant
  torque_constant_nm_per_a: 1.077

# canonical leg order: FL, FR, BL, BR
legs: [FL, FR, BL, BR]

# 12 servos in per-leg ID blocks: FL=1-3, FR=4-6, BL=7-9, BR=10-12
joints:
  # front left
  - {name: shoulder_FL, leg: FL, joint: shoulder, motor_id: 1,  limit_rad: [-1.57079632679,  1.57079632679], offset_deg: 180.0, direction:  1}
  - {name: wing_FL,     leg: FL, joint: wing,     motor_id: 2,  limit_rad: [-0.872664625997, 0.872664625997], offset_deg: 180.0, direction:  1}
  - {name: knee_FL,     leg: FL, joint: knee,     motor_id: 3,  limit_rad: [-2.00712863979,  1.57079632679], offset_deg: 180.0, direction:  1}
  # front right
  - {name: shoulder_FR, leg: FR, joint: shoulder, motor_id: 4,  limit_rad: [-1.57079632679,  1.57079632679], offset_deg: 180.0, direction:  1}
  - {name: wing_FR,     leg: FR, joint: wing,     motor_id: 5,  limit_rad: [-0.872664625997, 0.872664625997], offset_deg: 180.0, direction:  1}
  - {name: knee_FR,     leg: FR, joint: knee,     motor_id: 6,  limit_rad: [-2.00712863979,  1.57079632679], offset_deg: 180.0, direction:  1}
  # back left
  - {name: shoulder_BL, leg: BL, joint: shoulder, motor_id: 7,  limit_rad: [-1.57079632679,  1.57079632679], offset_deg: 180.0, direction:  1}
  - {name: wing_BL,     leg: BL, joint: wing,     motor_id: 8,  limit_rad: [-0.872664625997, 0.872664625997], offset_deg: 180.0, direction:  1}
  - {name: knee_BL,     leg: BL, joint: knee,     motor_id: 9,  limit_rad: [-2.00712863979,  1.57079632679], offset_deg: 180.0, direction:  1}
  # back right
  - {name: shoulder_BR, leg: BR, joint: shoulder, motor_id: 10, limit_rad: [-1.57079632679,  1.57079632679], offset_deg: 180.0, direction:  1}
  - {name: wing_BR,     leg: BR, joint: wing,     motor_id: 11, limit_rad: [-0.872664625997, 0.872664625997], offset_deg: 180.0, direction:  1}
  - {name: knee_BR,     leg: BR, joint: knee,     motor_id: 12, limit_rad: [-2.00712863979,  1.57079632679], offset_deg: 180.0, direction:  1}

# link offsets as 3D vectors (mm), each expressed in its parent joint's frame
# at zero pose. shared across legs, the leg geometry itself is identical.
# only the body→shoulder transform differs (encoded in shoulder body quats
# in description/quadruped.xml).
# FK composes these directly: foot = Rz(t1)*(L1 + Rx(t2)*(L2 + Rx(t3)*L3))
links_mm:
  shoulder_to_wing: [-20.25, -23.25, 21.4]
  wing_to_knee: [0.0, -107.5, -23.25]
  knee_to_foot: [21.0, 0.0, -110.0]

foot_site_offset_mm: [21, -12, 0]
# nominal resting foot in leg-local frame
target_site_offset_mm: [0, -133, -80]

mjcf:
  # MJCF sites are per-leg suffixed: foot_site_FL, target_site_FL, ...
  foot_site_name: foot_site
  target_site_name: target_site
  joint_names:
    - shoulder_joint_FL
    - wing_joint_FL
    - knee_joint_FL
    - shoulder_joint_FR
    - wing_joint_FR
    - knee_joint_FR
    - shoulder_joint_BL
    - wing_joint_BL
    - knee_joint_BL
    - shoulder_joint_BR
    - wing_joint_BR
    - knee_joint_BR
