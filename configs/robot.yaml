robot: single_leg
description_xml: description/single_leg.xml

serial:
  baud_host: 57600          # SoftwareSerial ceiling on UNO R3
  baud_dxl: 115200

joints:
  - name: shoulder
    motor_id: 1
    limit_rad: [-1.57079632679, 1.57079632679]
    offset_deg: 180.0
    direction: 1
  - name: wing
    motor_id: 2
    limit_rad: [-0.872664625997, 0.872664625997]
    offset_deg: 180.0
    direction: 1
  - name: knee
    motor_id: 3
    limit_rad: [-2.00712863979, 1.57079632679]
    offset_deg: 180.0
    direction: 1

# Link offsets as 3D vectors (mm), each expressed in its parent joint's frame
# at zero pose. Derived from the joint geometry in description/single_leg.xml.
# FK composes these directly: foot = Rz(t1).(L1 + Rx(t2).(L2 + Rx(t3).L3))
links_mm:
  shoulder_to_wing: [-20.25, -23.25, 21.4]
  wing_to_knee: [0.0, -107.5, -23.25]
  knee_to_foot: [21.0, 0.0, -110.0]

foot_site_offset_mm: [21, -12, 0]
target_site_offset_mm: [20, -175, -50]

mjcf:
  foot_site_name: foot_site
  target_site_name: target_site
  joint_names:
    - shoulder_joint
    - wing_joint
    - knee_joint
